<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rush CV - Portfolio Hub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-body">

    <!-- Header Overlay with Top-to-Bottom Fade -->
    <header class="home-header text-center">
        <h1 class="rush-title">RUSH CV</h1>
        <p class="rush-subtitle">Find more about us!</p>
    </header>

    <!-- Fullscreen Split Hero Section -->
    <main class="split-container">
        <!-- Profile 1: Jirapat -->
        <a href="views/cv_pkaewman.html" class="split-panel panel-left text-decoration-none">
            <div class="panel-bg" style="background-image: url('images/pkaewman.JPG');"></div>
            <div class="panel-content">
                <h2>Jirapat Kaewman</h2>
                <span class="view-btn">View CV</span>
            </div>
        </a>

        <!-- Profile 2: Supawitch (stiatrag) -->
        <a href="views/cv_stiatrag.html" class="split-panel panel-right text-decoration-none">
            <!-- หากยังไม่มีรูป stiatrag.jpg จะใช้ภาพกราฟิกทดแทนก่อนได้ -->
            <div class="panel-bg" style="background-image: url('images/stiatrag.jpg');"></div>
            <div class="panel-content">
                <h2>Supawitch Tiatragul</h2>
                <span class="view-btn">View CV</span>
            </div>
        </a>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
