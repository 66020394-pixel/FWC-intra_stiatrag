<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <div class="card-header">
            User Profile Card
        </div>

        <table>
            <tr>
                <td>
                    <img class="profile-img" src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?auto=format&fit=crop&w=400&q=80" alt="Profile Picture">
                </td>
            </tr>
            <tr>
                <td>
                    <div class="login">stiatrag</div>
                </td>
            </tr>
            <tr>
                <td>
                    <p class="desc">Level 25, Creative</p>
                </td>
            </tr>
            <tr>
                <td>
                    <div class="social-icons">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733558.png" alt="Instagram">
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <a class="contact-btn" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank">Contact</a>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
