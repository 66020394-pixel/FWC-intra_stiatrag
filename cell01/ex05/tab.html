<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            width: 50%;
            height: 150px;
            text-align: center;
            vertical-align: middle;
            font-size: 24px;
            font-family: sans-serif;
            color: white;
            border: 2px solid black;
        }
        .first-box {
            background-color: #3498db;
        }
        .second-box {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="first-box">Not Red</td>
            <td class="second-box">Not Blue</td>
        </tr>
    </table>
</body>
</html>
