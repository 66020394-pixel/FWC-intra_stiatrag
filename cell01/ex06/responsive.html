<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
        }
        td {
            text-align: center;
            vertical-align: middle;
            font-size: 24px;
            font-family: sans-serif;
            color: white;
        }
        .first-box {
            background-color: #3498db;
            width: 50%;
        }
        .second-box {
            background-color: #e74c3c;
            width: 50%;
        }
        @media (max-width: 600px) {
            td {
                display: block;
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="first-box">Not Red</td>
            <td class="second-box">Not Blue</td>
        </tr>
    </table>
</body>
</html>
